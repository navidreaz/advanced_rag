[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "navidreza-haz-rag"
version = "0.1.0"
description = "RAG application using LangChain and Hugging Face models"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "langchain==1.4.0",
    "langchain-community==0.4.2",
    "langchain-huggingface==1.2.2",
    "transformers==5.16.1",
    "sentence-transformers==6.0.1",
    "torch==2.11.0",
    "faiss-cpu==1.12.0",
    "chromadb==1.5.9",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_project"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"